[package]
name = "babel-proto"
version = "0.1.0"
edition = "2024"

[features]
std = []
alloc = ["defmt?/alloc"]
defmt = ["dep:defmt"]
log = ["dep:log"]

default = ["log"]

[dependencies]
defmt = { version = "1", optional = true }
log = { version = "0.4", optional = true, default-features = false }

[dev-dependencies]
env_logger = "0.11"
