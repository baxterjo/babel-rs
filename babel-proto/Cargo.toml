[package]
name = "babel-proto"
description = "A Sans-IO implementation of the Babel routing protocol as defined in IETF RFC 8966."
readme = "README.md"
license = "MIT"
keywords = ["babel", "routing", "networking", "sans-io"]
catagories = ["network-programming"]
version = "0.0.1"
edition = "2024"

[features]
std = ["alloc", "log?/std"]
alloc = ["defmt?/alloc", "log?/alloc"]
defmt = ["dep:defmt"]
log = ["dep:log"]

default = ["std", "log"]
# default = ["alloc", "defmt"]
# default = ["defmt"]

[dependencies]
defmt = { version = "1", optional = true }
log = { version = "0.4", optional = true, default-features = false }
thiserror = { version = "2.0.19", default-features = false }

[dev-dependencies]
env_logger = "0.11"
rand = "0.10.2"
